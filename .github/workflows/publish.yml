name: 发布到 npm

# 用法：
#   1. 在 npmjs.com -> Access Tokens -> Generate New Token -> Granular Access Token
#      （Classic / Automation token 已于 2025 年 11 月下架，现在只有 Granular）：
#      Permissions 选 Read and write，勾选 Bypass 2FA，Expiration 设 90 天；
#      首次发布前包还不存在，Packages 选 All packages，发出去后再收窄到单个包。
#      生成后存到仓库 Settings -> Secrets and variables -> Actions -> NPM_TOKEN
#   2. 改完代码后 npm version patch / minor / major，然后把 commit 和 tag 一起推上来：
#        git push && git push --tags
#   3. 也可以在 Actions 页面手动 "Run workflow"（workflow_dispatch）发布当前版本
#   4. ⚠️ 工作流只负责把版本提交到 npm 暂存区，发布不会立即生效：
#      需要维护者到 npmjs.com -> 包页面 -> Staged Packages 里用 2FA 点 Approve，
#      版本才真正上架（npm 已限制 bypass-2FA token 直接发布，CI 无法绕过这一步）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 防止打错 tag 导致发布了与 package.json 不一致的版本
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag 版本 $TAG 与 package.json 的 $PKG 不一致，先跑 npm version patch"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # npm stage 相关命令需要 Node 22.14+ / npm CLI 11.15+
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: 安装依赖
        run: npm ci

      # dist/ 被 .gitignore 忽略，CI 上必须先构建出产物
      - name: 构建
        run: npm run build

      - name: 升级 npm
        # GitHub 托管的 Node 22 自带 npm 10.x，而 npm stage 命令要 11.15+
        run: npm install -g npm@latest

      - name: 检查 npm 凭据
        # ENEEDAUTH（而不是 401）几乎都是这个原因：secrets.NPM_TOKEN 没注入成功。
        # 常见三种：secret 名字拼错/带空格、secret 建在了 Environment 而不是 Repository、
        # 或者根本没点 Add secret 保存。这里只打印长度不打印内容，便于排查又不泄露。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "node: $(node -v) | npm: $(npm -v)"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::secrets.NPM_TOKEN 为空。请到仓库 Settings -> Secrets and variables -> Actions，确认存在名为 NPM_TOKEN 的 Repository secret（全大写、前后无空格）。"
            exit 1
          fi
          echo "NPM_TOKEN 已注入，长度 ${#NODE_AUTH_TOKEN}"
          echo "--- 仓库根 .npmrc ---"
          cat .npmrc 2>/dev/null || echo "(无)"
          echo "--- 用户级 ~/.npmrc（token 已打码）---"
          sed -E 's/(_authToken=).*/\1***/' ~/.npmrc 2>/dev/null || echo "(无)"

      - name: 提交到 npm 暂存区
        # 这里刻意不用 npm publish：npm 已限制 bypass-2FA token 直接发布，
        # publish 会被静默转成 staged，返回值却仍是成功，很容易误判成"已发布"。
        # 显式用 stage publish 语义清楚，失败也能看见。
        # 跑完后需要维护者到 npmjs.com -> Staged Packages 用 2FA 点 Approve 才真正上架。
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
